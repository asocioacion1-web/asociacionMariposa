<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias</title>
    <link rel="icon" type="image/png" href="/assets/imagenes/FundacionLogo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/navbar.css">

</head>

<body>
    <!-- NAVBAR -->
    <div id="navbar-placeholder"></div>

    <!-- HERO -->
    <section class="hero text-center">
        <div class="container">
            <h1 class="display-4">Noticias</h1>
            <p class="lead">
                Todas las novedades, eventos y actividades de nuestra comunidad.
            </p>
        </div>
    </section>


    <!-- NOTICIAS -->
    <section id="noticias" class="py-5">
        <div class="container">

            <!-- TÍTULO -->
            <div class="text-center mb-4">
                <h2>Últimas noticias</h2>
                <p class="text-muted">Enterate de todo lo que está pasando.</p>
            </div>
            <hr>

            <!-- TARJETAS (se cargan desde Supabase) -->
            <div class="row g-4">
                <div class="col-12 text-center text-muted">
                    Cargando noticias...
                </div>
            </div>

        </div>
    </section>


    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- MODAL NOTICIA -->
    <div class="modal fade" id="modalNoticia" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalNoticiaTitulo"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <img id="modalNoticiaImagen" class="img-fluid rounded mb-3 d-none" alt="">
                    <p class="text-muted small mb-1" id="modalNoticiaFecha"></p>
                    <h6 id="modalNoticiaSubtitulo"></h6>
                    <p id="modalNoticiaParrafo" style="white-space: pre-line"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/footer.js"></script>
    <script src="/assets/js/navbar.js"></script>
    <script>
        let ApiURL = "";
        let ApiKey = "";

        // Pide la URL y la key al servidor (en vez de dejarlas escritas en el JS)
        async function cargarConfig() {
            const respuesta = await fetch("/api/config");
            if (!respuesta.ok) {
                throw new Error(`No se pudo leer /api/config (HTTP ${respuesta.status})`);
            }
            const config = await respuesta.json();
            ApiKey = config.anonKey;
            ApiURL = `${config.url}/rest/v1/noticias?select=*&order=fecha.desc`;
        }

        // Evita que texto de la base de datos se interprete como HTML
        function escapeHtml(texto) {
            return String(texto ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        // "Música" -> "musica" (para armar la clase badge-musica)
        function slugCategoria(categoria) {
            return String(categoria ?? "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim()
                .replace(/\s+/g, "-");
        }

        // Formatea como "11 de septiembre de 2026" sin corrimiento de zona horaria
        function formatearFecha(valor) {
            if (!valor) return "";
            const fecha = /^\d{4}-\d{2}-\d{2}$/.test(valor)
                ? new Date(valor + "T00:00:00")
                : new Date(valor);
            if (isNaN(fecha)) return "";
            return fecha.toLocaleDateString("es-UY", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });
        }

        let noticiasCargadas = [];

        function abrirModalNoticia(noticia) {
            document.getElementById("modalNoticiaTitulo").textContent = noticia.titulo ?? "";
            document.getElementById("modalNoticiaFecha").textContent = formatearFecha(noticia.fecha);
            document.getElementById("modalNoticiaSubtitulo").textContent = noticia.categoria ?? "";
            document.getElementById("modalNoticiaParrafo").textContent = noticia.parrafo ?? "";

            const img = document.getElementById("modalNoticiaImagen");
            if (noticia.imagen) {
                img.src = noticia.imagen;
                img.alt = noticia.titulo ?? "";
                img.classList.remove("d-none");
            } else {
                img.removeAttribute("src");
                img.classList.add("d-none");
            }

            bootstrap.Modal.getOrCreateInstance(document.getElementById("modalNoticia")).show();
        }

        function mostrarMensaje(contenedor, texto) {
            contenedor.innerHTML = `
                <div class="col-12 text-center text-muted">${escapeHtml(texto)}</div>
            `;
        }

        async function cargarNoticias() {
            const contenedorNoticias = document.querySelector("#noticias .row.g-4");

            try {
                await cargarConfig();

                const respuesta = await fetch(ApiURL, {
                    method: "GET",
                    headers: {
                        apikey: ApiKey,
                        Authorization: `Bearer ${ApiKey}`
                    }
                });

                if (!respuesta.ok) {
                    throw new Error(`Error HTTP: ${respuesta.status}`);
                }

                const data = await respuesta.json();
                noticiasCargadas = data;

                if (data.length === 0) {
                    mostrarMensaje(contenedorNoticias, "Todavía no hay noticias publicadas.");
                    return;
                }

                // Limpiar el "Cargando..."
                contenedorNoticias.innerHTML = "";

                data.forEach((noticia, indice) => {
                    const card = document.createElement("div");
                    card.className = "col-md-6 col-lg-4";

                    const imagen = noticia.imagen
                        ? `<img src="${escapeHtml(noticia.imagen)}" alt="${escapeHtml(noticia.titulo)}">`
                        : "";

                    const badge = noticia.categoria
                        ? `<span class="badge-cat badge-${escapeHtml(slugCategoria(noticia.categoria))} align-self-start">${escapeHtml(noticia.categoria)}</span>`
                        : "";

                    card.innerHTML = `
                        <div class="card-noticia">
                            ${imagen}
                            <div class="p-3 d-flex flex-column flex-grow-1">
                                ${badge}
                                <p class="fecha-noticia mt-2 mb-1">${formatearFecha(noticia.fecha)}</p>
                                <h5>${escapeHtml(noticia.titulo)}</h5>
                                <p class="text-secondary small">${escapeHtml(noticia.parrafo)}</p>
                                <a href="#" class="fw-bold text-decoration-none btn-leer-mas"
                                   style="color:var(--azul-700)" data-indice="${indice}">
                                    Leer más →
                                </a>
                            </div>
                        </div>
                    `;

                    contenedorNoticias.appendChild(card);
                });

                console.log("Noticias cargadas:", data);

            } catch (error) {
                console.error("Error al cargar las noticias:", error);
                mostrarMensaje(contenedorNoticias, "No pudimos cargar las noticias. Intentá de nuevo más tarde.");
            }
        }

        // Un solo listener para todos los botones "Leer más"
        document.querySelector("#noticias .row.g-4").addEventListener("click", (e) => {
            const boton = e.target.closest(".btn-leer-mas");
            if (!boton) return;
            e.preventDefault();
            const noticia = noticiasCargadas[Number(boton.dataset.indice)];
            if (noticia) abrirModalNoticia(noticia);
        });

        cargarNoticias();
    </script>
</body>
</html>
