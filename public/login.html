<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fundación Mariposa Azul</title>
    <link rel="icon" type="image/png" href="/assets/imagenes/FundacionLogo.png">
    
    
    <link rel="stylesheet" href="/assets/css/loginStyle.css">
</head>
<body>

<form class="card" id="loginForm" novalidate>
  <div class="avatar">
    <svg viewBox="0 0 24 24">
      <path d="M4 8h3l2-2h6l2 2h3v11H4z"/>
      <circle cx="12" cy="13" r="3.2"/>
      <img src="/assets/imagenes/FundacionLogo.webp" alt="Logo de la Fundación Mariposa Azul" class="logo">
    </svg>
  </div>

  <div class="field">
    <input type="email" placeholder="Email" id="user">
  </div>

  <div class="field">
    <div class="pass-wrap">
      <input type="password" placeholder="Contraseña" id="contra">
      <button type="button" class="ver-password" aria-label="Mostrar contraseña" aria-pressed="false">
        <svg class="ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="ojo-tachado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
      </button>
    </div>
  </div>

  <div class="olvido">
    <a href="#" id="olvidoPassword">¿Olvidaste tu contraseña?</a>
  </div>

  <button type="submit" id="inicioSesion">INICIAR SESION</button><br><br>

  <button type="button" id="abrirRegistro">REGISTRARSE</button><br><br>
  
  <button type="button" onclick="window.location.href='/index.html'">VISITANTE</button>

</form>

<dialog id="modalRegistro" class="modal-registro">
  <form id="registroForm" novalidate>
    <h2>Crear cuenta</h2>

    <div class="reg-fila">
      <input type="text" id="regNombre" placeholder="Nombre" maxlength="50">
      <input type="text" id="regApellido" placeholder="Apellido" maxlength="50">
    </div>

    <label for="regNacimiento">Fecha de nacimiento</label>
    <input type="date" id="regNacimiento">

    <input type="tel" id="regTelefono" placeholder="Teléfono (ej: 099123456)" maxlength="9" inputmode="numeric">
    <input type="email" id="regEmail" placeholder="Email">
    <div class="pass-wrap">
      <input type="password" id="regPassword" placeholder="Contraseña (mínimo 8 caracteres)">
      <button type="button" class="ver-password" aria-label="Mostrar contraseña" aria-pressed="false">
        <svg class="ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="ojo-tachado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
      </button>
    </div>


    <div class="reg-acciones">
      <button type="button" id="cerrarRegistro">CANCELAR</button>
      <button type="submit" id="enviarRegistro">CREAR CUENTA</button>
    </div>
  </form>
</dialog>

<dialog id="modalRecuperar" class="modal-registro">
  <form id="recuperarForm" novalidate>
    <h2>Recuperar contraseña</h2>
    <p class="texto-recuperar">Escribí el email de tu cuenta y te enviamos un enlace para elegir una contraseña nueva.</p>

    <input type="email" id="recEmail" placeholder="Email" autocomplete="email">

    <div class="reg-acciones">
      <button type="button" id="cerrarRecuperar">CANCELAR</button>
      <button type="submit" id="enviarRecuperar">ENVIAR ENLACE</button>
    </div>
  </form>
</dialog>
<dialog id="modalConfirmar" class="modal-registro">
  <h2>¡Te registraste correctamente!</h2>
  <p class="texto-recuperar">Entrá a tu email para confirmar tu cuenta.</p>
  <p class="texto-recuperar"><strong>IMPORTANTE:</strong> si no la confirmás, no vas a poder iniciar sesión.</p>

  <div class="reg-acciones">
    <button type="button" id="irAlEmail">EMAIL</button>
    <button type="button" id="aceptarConfirmar">ACEPTAR</button>
  </div>
</dialog>


<script>

  document.querySelectorAll(".ver-password").forEach((boton) => {
    boton.addEventListener("click", () => {
      const campo = boton.parentElement.querySelector("input");
      const mostrar = campo.type === "password";

      campo.type = mostrar ? "text" : "password";
      boton.classList.toggle("activo", mostrar);
      boton.setAttribute("aria-pressed", mostrar);
      boton.setAttribute("aria-label", mostrar ? "Ocultar contraseña" : "Mostrar contraseña");
    });
  });

  // Al cerrar el registro, la contraseña vuelve a ocultarse
  document.getElementById("modalRegistro").addEventListener("close", () => {
    const campo = document.getElementById("regPassword");
    campo.type = "password";
    const boton = campo.parentElement.querySelector(".ver-password");
    boton.classList.remove("activo");
    boton.setAttribute("aria-pressed", "false");
    boton.setAttribute("aria-label", "Mostrar contraseña");
  });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/mensajes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
let config;
  try {
    config = await (await fetch("/api/config")).json();
  } catch (e) {
    mostrarMensaje("Error al cargar la configuración. Asegúrate de que el servidor esté en funcionamiento.");
    throw e;
  }

  const clienteSupabase = supabase.createClient(config.url, config.anonKey);
  const modalRegistro = document.getElementById("modalRegistro");
  const modalRecuperar = document.getElementById("modalRecuperar");

  // Const para validaciones
  const LETRAS = "A-Za-zÁÉÍÓÚáéíóúÑñÜü";
    const REGEX_NOMBRE = new RegExp(`^[${LETRAS}]+(?: [${LETRAS}]+)*$`);
    const REGEX_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,6}$/;

  function validarNombre(valor, etiqueta) {
    if (valor === "") return `Ingresá tu ${etiqueta}.`;
    if (valor !== valor.trim()) return `El ${etiqueta} no puede empezar ni terminar con espacios.`;
    if (!REGEX_NOMBRE.test(valor)) return `El ${etiqueta} solo puede tener letras (con tildes, ñ o ü), sin números ni símbolos.`;
    return null;
  }

  function validarContrasenia(contra) {
    const errores = [];
    if (contra.length < 8) errores.push("La contraseña debe tener al menos 8 caracteres.");
    if (!/[A-ZÁÉÍÓÚÑÜ]/.test(contra)) errores.push("La contraseña debe tener al menos una mayúscula.");
    if (!/\d/.test(contra)) errores.push("La contraseña debe tener al menos un número.");
    if (!/[^\p{L}\p{N}\s]/u.test(contra)) errores.push("La contraseña debe tener al menos un carácter especial (por ejemplo ! @ # $ %).");
    return errores;
  }

  // Validaciones del inicio de sesión: devuelve la lista de errores (vacía si todo está bien)
  function validarLogin({ email, contra }) {
    const errores = [];

    if (email === "") errores.push("Ingresá tu email.");
    else if (!REGEX_EMAIL.test(email)) errores.push("El email no es válido (sin espacios, con @ y un dominio).");

    errores.push(...validarContrasenia(contra));

    return errores;
  }

  // Muestra un aviso; si el modal está abierto, lo pone adentro para que se vea
  function avisar(mensajes, tipo = "danger") {
    mostrarMensaje(mensajes, tipo);
    const contenedor = document.getElementById("contenedor-toasts");
    const destino = [modalRegistro, modalRecuperar].find(m => m.open) || document.body;
    if (contenedor && contenedor.parentElement !== destino) destino.appendChild(contenedor);
  }

  async function hashContrasena(email, password) {
    const texto = `${email.trim().toLowerCase()}:${password}:mariposa-azul`;
    const datos = new TextEncoder().encode(texto);
    const buffer = await crypto.subtle.digest("SHA-256", datos);
    return [...new Uint8Array(buffer)]
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");
  }

  async function enviar() {
    const email = document.getElementById("user").value;
    const password = document.getElementById("contra").value;

    const errores = validarLogin({ email, contra: password });

    if (errores.length) return avisar(errores);

    const passwordHash = await hashContrasena(email, password);

    const { data, error } = await clienteSupabase.auth.signInWithPassword({
      email,
      password: passwordHash,
    });

    if (error) {
      console.log("Error de login:", error);
      avisar("Usuario o contraseña incorrectos");
      return;
    }
    window.location.href = "/index.html";
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    await enviar();
  });

  document.getElementById("olvidoPassword").addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById("recuperarForm").reset();
    document.getElementById("recEmail").value = document.getElementById("user").value.trim();
    modalRecuperar.showModal();
  });

  document.getElementById("cerrarRecuperar").addEventListener("click", () => modalRecuperar.close());

  document.getElementById("recuperarForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("recEmail").value.trim().toLowerCase();

    if (!REGEX_EMAIL.test(email)) return avisar("El email no es válido.");

    const boton = document.getElementById("enviarRecuperar");
    boton.disabled = true;

    const { error } = await clienteSupabase.auth.resetPasswordForEmail(email, {
      redirectTo: `${window.location.origin}/public/restablecer.html`
    });

    boton.disabled = false;

    if (error) {
      console.log("Error al recuperar la contraseña:", error);
      return avisar(error.status === 429 || String(error.message).toLowerCase().includes("rate limit")
        ? "Se enviaron muchos correos en poco tiempo. Esperá un rato e intentá de nuevo."
        : "No se pudo enviar el correo. Intentá de nuevo.");
    }

    modalRecuperar.close(); 
    avisar("Si el email está registrado, te enviamos un enlace para cambiar la contraseña.", "success");
  });

  //Registro
  const hoy = () => new Date().toLocaleDateString("sv-SE"); // AAAA-MM-DD

  document.getElementById("abrirRegistro").addEventListener("click", () => {
    document.getElementById("registroForm").reset();
    document.getElementById("regNacimiento").max = hoy();
    modalRegistro.showModal();
  });

  document.getElementById("regTelefono").addEventListener("input", (e) => {
    e.target.value = e.target.value.replace(/\D/g, "");
  });

  function validarRegistro({ nombre, apellido, nacimiento, telefono, email, contra }) {
    const errores = [];

    const errorNombre = validarNombre(nombre, "nombre");
    if (errorNombre) errores.push(errorNombre);

    const errorApellido = validarNombre(apellido, "apellido");
    if (errorApellido) errores.push(errorApellido);

    if (!/^09\d{7}$/.test(telefono)) {
      errores.push("El teléfono debe tener 9 números y empezar con 09 (por ejemplo 099123456), sin espacios ni símbolos.");
    }

    if (!nacimiento) {
      errores.push("Ingresá tu fecha de nacimiento.");
    } else {
      const fecha = new Date(nacimiento + "T00:00:00");
      // Se comprueba que la fecha exista de verdad (ej: no existe el 31/02)
      const existe = !isNaN(fecha) && fecha.toLocaleDateString("sv-SE") === nacimiento;

      if (!existe) errores.push("La fecha de nacimiento no es válida.");
      else if (nacimiento > hoy()) errores.push("La fecha de nacimiento no puede ser futura.");
      else if (nacimiento < "1900-01-01") errores.push("La fecha de nacimiento no puede ser anterior al 01/01/1900.");
    }

    if (email === "") errores.push("Ingresá tu email.");
    else if (!REGEX_EMAIL.test(email)) errores.push("El email no es válido (sin espacios, con @ y un dominio).");

    errores.push(...validarContrasenia(contra));

    return errores;
  }

  document.getElementById("cerrarRegistro").addEventListener("click", () => modalRegistro.close());

    const modalConfirmar = document.getElementById("modalConfirmar");
  let correoRegistrado = "";

  const BUZONES = {
    "gmail.com": "https://mail.google.com",
    "googlemail.com": "https://mail.google.com",
    "outlook.com": "https://outlook.live.com/mail",
    "hotmail.com": "https://outlook.live.com/mail",
    "live.com": "https://outlook.live.com/mail",
    "yahoo.com": "https://mail.yahoo.com",
    "icloud.com": "https://www.icloud.com/mail",
  };

  function mostrarConfirmacion(email) {
    correoRegistrado = email;
    modalConfirmar.showModal();
  }

  document.getElementById("irAlEmail").addEventListener("click", () => {
    const dominio = correoRegistrado.split("@")[1]?.toLowerCase();
    const url = BUZONES[dominio] || "https://mail.google.com";
    window.open(url, "_blank", "noopener");
  });

  document.getElementById("aceptarConfirmar").addEventListener("click", () => modalConfirmar.close());

  modalConfirmar.addEventListener("cancel", (e) => e.preventDefault());

  document.getElementById("registroForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const nombre = document.getElementById("regNombre").value;
    const apellido = document.getElementById("regApellido").value;
    const nacimiento = document.getElementById("regNacimiento").value;
    const telefono = document.getElementById("regTelefono").value;
    const email = document.getElementById("regEmail").value;
    const contra = document.getElementById("regPassword").value;

    const errores = validarRegistro({ nombre, apellido, nacimiento, telefono, email, contra });

    if (errores.length) return avisar(errores);

    const boton = document.getElementById("enviarRegistro");
    boton.disabled = true;

    const passwordHash = await hashContrasena(email, contra);

    const { data, error } = await clienteSupabase.auth.signUp({
      email,
      password: passwordHash,
      options: {
        data: { nombre, apellido, fecha_nacimiento: nacimiento, telefono }
      }
    });

    boton.disabled = false;

    if (error) {
      console.log("Error de registro:", error);
      return avisar(error.message.includes("already")
        ? "Ese email ya está registrado."
        : "No se pudo crear la cuenta. Revisá los datos.");
    }

    modalRegistro.close();
    if (data.session) {
      avisar("¡Cuenta creada! Entrando...", "success");
      setTimeout(() => { window.location.href = "/index.html"; }, 1200);
    } else {
      mostrarConfirmacion(email);
    }
  });
</script>

</body>
</html>
