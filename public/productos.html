  <!-- MENU LATERAL -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="menuLateral" aria-labelledby="menuLateralLabel">

        <a href="/public/productos.html" class="btn btn-outline-primary text-start">🛍️ Productos</a>
        <a href="/public/ayuda.html" class="btn btn-outline-primary text-start">❓ Ayuda</a>

      </div>
    </div>
  </div>
    
    <div id="form-section" class="form-seccion">
      <h2>Publicar Producto</h2>
      <form id="formProducto">
        <label for="nombre">Nombre del producto:</label>
        <input type="text" id="nombre" placeholder="Nombre del producto" required />

        <label for="foto">Foto del producto:</label>
        <input type="file" id="foto" accept="image/*" required />

        <label for="info">Información del producto:</label>
        <textarea id="info" placeholder="Información sobre el producto..." required></textarea>

        <button type="submit">Publicar</button>
      </form>
    </div>

    <div class="separador"></div>

    <!-- Sección de tarjetas (Únicas con caja blanca) -->
    <h2>Productos Publicados</h2>
    <div id="productosContainer">

    </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">

    const form = document.getElementById('formProducto');
    const productosContainer = document.getElementById('productosContainer');
    let productos = [];

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const nombre = document.getElementById('nombre').value.trim();
      const info = document.getElementById('info').value.trim();
      const fotoInput = document.getElementById('foto');

      if (fotoInput.files && fotoInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const nuevoProducto = {
            nombre: nombre,
            info: info,
            foto: e.target.result
          };
          productos.push(nuevoProducto);
          mostrarProductos();
          form.reset();
        };
        reader.readAsDataURL(fotoInput.files[0]);
      }
    });

    function mostrarProductos() {
      productosContainer.innerHTML = '';
      productos.forEach((producto) => {
        const div = document.createElement('div');
        div.classList.add('producto');

        div.innerHTML = `
          <img src="${producto.foto}" alt="Foto de ${producto.nombre}" />
          <div class="producto-contenido">
            <div class="producto-nombre">${producto.nombre}</div>
            <div class="producto-info">${producto.info}</div>
          </div>
        `;

        productosContainer.appendChild(div);
      });
    }

    const formSection = getElementById('form-section');

    if(formSection){

    }
        
  </script>

</body>
