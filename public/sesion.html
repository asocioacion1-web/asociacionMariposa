<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi sesión</title>
    <link rel="icon" type="image/png" href="/assets/imagenes/FundacionLogo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/navbar.css">
    <link rel="stylesheet" href="/assets/css/sesion.css">
</head>

<body>

 <!-- NAVBAR -->
  <div id="navbar-placeholder"></div>

    <div class="contenedor">

        <h1>Mi sesión</h1>

        <!-- INFORMACIÓN DE LA CUENTA (se rellena con los datos reales) -->
        <div id="admin" class="info-admin" style="display: none;">
            <h2 id="perfilTitulo">Mi información</h2>

            <p><strong>Nombre:</strong> <span id="perfilNombre"></span></p>
            <p><strong>Rol:</strong> <span id="perfilRol"></span></p>
            <p><strong>Email:</strong> <span id="perfilEmail"></span></p>
            <p><strong>Teléfono:</strong> <span id="perfilTelefono"></span></p>
            <p><strong>Fecha de nacimiento:</strong> <span id="perfilNacimiento"></span></p>
        </div>

        <!-- MENSAJE PARA INVITADO -->
        <div id="invitado" class="mensaje" style="display: none;">
            <h2>🔒 Inicia sesión</h2>
            <p>Debes iniciar sesión para ver tu información.</p>

            <button type="button" id="btnIniciarSesionPagina">
                Iniciar sesión
            </button>
        </div>

        <!-- ERROR DE CONEXIÓN -->
        <p id="errorSesion" style="display: none;"></p>

    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/navbar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script type="module">

    const bloqueCuenta = document.getElementById("admin");
    const bloqueInvitado = document.getElementById("invitado");
    const errorSesion = document.getElementById("errorSesion");

    // Obtener configuración de Supabase
    let config;
    try {
        config = await (await fetch("/api/config")).json();
    } catch (e) {
        errorSesion.textContent = "No se pudo conectar con el servidor.";
        errorSesion.style.display = "block";
        throw e;
    }

    // Conectar con Supabase
    const clienteSupabase = supabase.createClient(config.url, config.anonKey);

    // Ver quién está conectado
    const { data: { user } } = await clienteSupabase.auth.getUser();
    const logueado = !!user;

    // ===== Menú lateral según la sesión =====
    document.getElementById("linkMiSesion").classList.toggle("d-none", !logueado);
    document.getElementById("btnSalirMenu").classList.toggle("d-none", !logueado);
    document.getElementById("btnIniciarSesion").classList.toggle("d-none", logueado);

    // ===== Botones =====
    document.getElementById("btnSalirMenu").addEventListener("click", async (e) => {
        e.preventDefault();
        await clienteSupabase.auth.signOut();
        window.location.href = "/public/login.html";
    });

    document.getElementById("btnIniciarSesionPagina").addEventListener("click", () => {
        window.location.href = "/public/login.html";
    });

    // ===== Contenido de la página =====
    // La fecha viene como AAAA-MM-DD; se arma a mano para que la zona horaria no la corra un día
    function formatearFecha(texto) {
        if (!texto) return "Sin completar";
        const [anio, mes, dia] = texto.split("-");
        return `${dia}/${mes}/${anio}`;
    }

    if (!logueado) {
        bloqueCuenta.style.display = "none";
        bloqueInvitado.style.display = "block";
    } else {
        const [perfilRes, adminRes] = await Promise.all([
            clienteSupabase
                .from("perfiles")
                .select("nombre, apellido, telefono, fecha_nacimiento, email")
                .eq("id", user.id)
                .maybeSingle(),
            clienteSupabase
                .from("admin")
                .select("id")
                .eq("user_id", user.id)
                .maybeSingle()
        ]);

        if (perfilRes.error) console.error("Error al cargar el perfil:", perfilRes.error);
        if (adminRes.error) console.error("Error al comprobar el rol:", adminRes.error);

        const perfil = perfilRes.data || {};
        const esAdmin = !!adminRes.data;

        const nombreCompleto = [perfil.nombre, perfil.apellido].filter(Boolean).join(" ");

        document.getElementById("perfilTitulo").textContent =
            esAdmin ? "Información del administrador" : "Mi información";
        document.getElementById("perfilNombre").textContent = nombreCompleto || "Sin completar";
        document.getElementById("perfilRol").textContent = esAdmin ? "Administrador" : "Usuario";
        document.getElementById("perfilEmail").textContent = perfil.email || user.email || "Sin completar";
        document.getElementById("perfilTelefono").textContent = perfil.telefono || "Sin completar";
        document.getElementById("perfilNacimiento").textContent = formatearFecha(perfil.fecha_nacimiento);

        bloqueCuenta.style.display = "block";
        bloqueInvitado.style.display = "none";
    }

</script>

</body>
</html>
